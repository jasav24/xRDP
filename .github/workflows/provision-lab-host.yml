name: RDP-Linux

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check Tailscale Secret
        run: |
          if [ -z "${{ secrets.TAILSCALE_AUTH_KEY }}" ]; then
            echo "::error::TAILSCALE_AUTH_KEY missing"
            exit 1
          fi

      - name: Install MATE desktop and xrdp
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -q
          # MATE desktop is extremely stable with xrdp and avoids xfconf/dbus session loops
          sudo apt-get install -yq --no-install-recommends \
            mate-desktop-environment mate-core mate-terminal xorg xorgxrdp xrdp dbus-x11 ssl-cert
          
          # Fix xrdp group permissions
          sudo adduser xrdp ssl-cert || true

      - name: Create RDP user and set password
        run: |
          # Create user 'rdp' if not exists
          sudo useradd -m -s /bin/bash rdp || true
          sudo usermod -aG sudo rdp
          
          # Set password to 1234
          echo "rdp:1234" | sudo chpasswd
          
          # Configure MATE desktop session for user 'rdp'
          echo "mate-session" | sudo tee /home/rdp/.xsession >/dev/null
          sudo chmod 755 /home/rdp/.xsession
          sudo chown rdp:rdp /home/rdp/.xsession

      - name: Start xrdp
        run: |
          sudo systemctl enable --now xrdp
          sudo systemctl restart xrdp
          sleep 2
          sudo systemctl is-active xrdp

      - name: Connect Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo systemctl enable --now tailscaled
          sudo tailscale up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" \
            --hostname="gh-linux-${GITHUB_RUN_ID}"
          
          TS_IP=""
          for i in $(seq 1 12); do
            TS_IP="$(tailscale ip -4 | head -n1 || true)"
            [ -n "$TS_IP" ] && break
            sleep 5
          done
          [ -n "$TS_IP" ] || { echo "::error::no Tailscale IP"; exit 1; }
          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: Show access info and keep alive
        run: |
          echo "========================================="
          echo " RDP Access Credentials"
          echo "========================================="
          echo " Address:  $TS_IP"
          echo " Username: rdp"
          echo " Password: 1234"
          echo "========================================="
          
          while true; do
            echo "[$(date)] RDP Session Active..."
            sleep 300
          done
