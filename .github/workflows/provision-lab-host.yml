name: RDP-Linux

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 360   # hosted runner-এর সর্বোচ্চ সীমা

    env:
      TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

    steps:
      - name: Check secrets
        run: |
          [ -n "$TS_AUTHKEY" ] || { echo "::error::TAILSCALE_AUTH_KEY missing"; exit 1; }

      - name: Install desktop and xrdp
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            xfce4 xfce4-terminal xorg xorgxrdp xrdp dbus-x11
          sudo adduser xrdp ssl-cert || true

      - name: Create RDP user with random password
        run: |
          PW="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | cut -c1-20)"
          echo "RDP_PASSWORD=$PW" >> "$GITHUB_ENV"
          sudo useradd -m -s /bin/bash rdpuser
          printf 'rdpuser:%s\n' "$PW" | sudo chpasswd
          sudo usermod -aG sudo rdpuser
          printf '#!/bin/sh\nexec startxfce4\n' | sudo tee /home/rdpuser/.xsession >/dev/null
          sudo chmod 755 /home/rdpuser/.xsession
          sudo chown rdpuser:rdpuser /home/rdpuser/.xsession

      - name: Start xrdp
        run: |
          sudo systemctl enable --now xrdp
          sudo systemctl restart xrdp
          sleep 3
          systemctl is-active xrdp
          ss -ltn | grep 3389

      - name: Connect Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TS_AUTHKEY" \
            --hostname="gh-linux-${GITHUB_RUN_ID}"
          TS_IP=""
          for i in $(seq 1 12); do
            TS_IP="$(tailscale ip -4 | head -n1 || true)"
            [ -n "$TS_IP" ] && break
            sleep 5
          done
          [ -n "$TS_IP" ] || { echo "::error::no Tailscale IP"; exit 1; }
          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: Show access info and keep alive
        run: |
          echo "=============================="
          echo "Address:  $TS_IP"
          echo "Username: rdpuser"
          echo "Password: $RDP_PASSWORD"
          echo "=============================="
          while true; do
            echo "[$(date)] RDP active"
            sleep 300
          done
